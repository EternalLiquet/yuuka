name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      release_bump:
        description: Semantic-version bump requested by a manual release workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/master') || inputs.release_bump != '') && 'yuuka-release-pipeline' || format('yuuka-ci-run-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    concurrency:
      group: yuuka-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-backend
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew
      - name: Run full backend verification
        env:
          YUUKA_BUILD_VERSION: 0.0.0-ci+${{ github.sha }}
        run: ./scripts/verify-backend.sh full
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/
            backend/build/reports/jacoco/
            backend/build/reports/pitest/
            backend/build/generated/openapi.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload backend jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/build/libs/backend-*.jar
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    concurrency:
      group: yuuka-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-mobile
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Run full mobile verification
        run: ./scripts/verify-mobile.sh full
      - name: Upload mobile reports and export
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-reports
          path: |
            mobile/coverage/
            mobile/dist/android/
          if-no-files-found: ignore
          retention-days: 14

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    concurrency:
      group: yuuka-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-infrastructure
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run full infrastructure verification
        env:
          YUUKA_VERSION: 0.0.0-ci
        run: ./scripts/verify-infrastructure.sh full

  release-decision:
    name: Release decision
    runs-on: ubuntu-latest
    needs:
      - backend
      - mobile
      - infrastructure
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      inputs.release_bump != ''
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve release request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUMP: ${{ inputs.release_bump }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_BUMP" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "Manual releases must be dispatched from master; got $GITHUB_REF." >&2
              exit 64
            fi

            case "$REQUESTED_BUMP" in
              patch|minor|major)
                bump="$REQUESTED_BUMP"
                ;;
              *)
                echo "Unsupported manual release bump: $REQUESTED_BUMP" >&2
                exit 64
                ;;
            esac

            echo "Manual $bump release requested for $GITHUB_SHA."
            echo "bump=$bump" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[] | select(.base.ref == "master" and .merged_at != null) | .labels[].name'
          )"
          bump="$(printf '%s\n' "$labels" | ./scripts/resolve-release-labels.sh)"

          if [[ "$bump" == "none" ]]; then
            echo "No release label found for $GITHUB_SHA; skipping GitHub Release publication."
          else
            echo "PR label requested a $bump release for $GITHUB_SHA."
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - release-decision
    if: needs.release-decision.outputs.bump != 'none'
    permissions:
      contents: write
    concurrency:
      group: yuuka-release-master
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew
      - name: Calculate release version
        id: version
        env:
          RELEASE_BUMP: ${{ needs.release-decision.outputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          ./scripts/check-release-ancestry.sh "$GITHUB_SHA"

          existing="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "$existing" ]]; then
            echo "Current commit already has release tag $existing"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="$RELEASE_BUMP"
          case "$bump" in
            patch|minor|major)
              ;;
            *)
              echo "Unsupported release bump: $bump" >&2
              exit 64
              ;;
          esac
          echo "Release bump is $bump"

          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$latest" ]]; then
            next="v1.0.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            case "$bump" in
              major)
                next="v$((major + 1)).0.0"
                ;;
              minor)
                next="v${major}.$((minor + 1)).0"
                ;;
              patch)
                next="v${major}.${minor}.$((patch + 1))"
                ;;
            esac
          fi

          echo "Next release tag is $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
      - name: Package backend release jar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -PyuukaVersion=${{ steps.version.outputs.version }}
      - name: Publish tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUMP: ${{ steps.version.outputs.bump }}
          ALREADY_TAGGED: ${{ steps.version.outputs.already_tagged }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -v "^${RELEASE_TAG}$" | sort -V | tail -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            changelog_range="${previous_tag}..HEAD"
          else
            changelog_range="HEAD"
          fi

          {
            echo "## ${RELEASE_TAG}"
            echo
            echo "- Version: ${RELEASE_VERSION}"
            echo "- Bump: ${RELEASE_BUMP}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Changes"
            git log "$changelog_range" --no-merges --format='- %s (%h)' || true
          } > release-notes.md

          if [[ "$ALREADY_TAGGED" != "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}

          Commit: ${GITHUB_SHA}"
            if ! git push origin "refs/tags/${RELEASE_TAG}"; then
              git fetch --tags --force
              if git tag --points-at HEAD --list "$RELEASE_TAG" | grep -q "^${RELEASE_TAG}$"; then
                echo "Tag ${RELEASE_TAG} was published by another run for this commit."
              else
                echo "Failed to publish ${RELEASE_TAG}; refusing to create a release for an unknown tag state."
                exit 1
              fi
            fi
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refreshing safe generated assets."
            gh release upload "$RELEASE_TAG" backend/build/libs/backend-*.jar docs/openapi.json --clobber
          else
            gh release create "$RELEASE_TAG" backend/build/libs/backend-*.jar docs/openapi.json \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
